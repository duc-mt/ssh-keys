name: Bug Report
description: Create a report to help us improve the SSH scripts
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: environment
    attributes:
      label: Operating System / Environment
      description: What OS are you running the scripts on? (e.g., macOS, Ubuntu, Windows WSL)
      placeholder: Ubuntu 22.04 / macOS Sonoma
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? (Include error messages if any)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this bug?
    validations:
      required: true
